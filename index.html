<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISTEM PELAPORAN LAPANGAN</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
background-color: #fdf6f0;
font-family: Arial, sans-serif;
font-size: 17px;
}
.container {
max-width: 800px;
margin-top: 50px;
}
.card {
border-radius: 10px;
box-shadow: 0 4px 12px rgba(230, 81, 0, 0.1);
border: 1px solid #ffe0b2;
}
.card-header {
background-color: #e65100; /* ORANYE GELAP */
color: #fff;
text-align: center;
font-size: 26px;
font-weight: bold;
border-top-left-radius: 10px !important;
border-top-right-radius: 10px !important;
text-transform: uppercase;
}
.form-label {
font-weight: bold;
color: #333;
text-transform: uppercase;
font-size: 1rem;
}
.form-control, .form-select {
font-size: 1.05rem;
font-weight: 600;
}
textarea.form-control {
font-weight: 500;
}
.btn-primary {
background-color: #e65100;
border-color: #e65100;
font-weight: bold;
text-transform: uppercase;
font-size: 1.05rem;
}
.btn-primary:hover {
background-color: #ff9800;
border-color: #ff9800;
}
.btn-secondary {
font-weight: bold;
text-transform: uppercase;
font-size: 1.05rem;
}
.nav-tabs .nav-link.active {
background-color: #e65100;
color: #fff;
text-transform: uppercase;
}
.nav-tabs .nav-link {
color: #e65100;
font-weight: bold;
text-transform: uppercase;
}
/* =====================================================================
TOMBOL NAVIGASI UTAMA BESAR: LAPORAN / RIWAYAT / KELOLA
Sengaja dibuat jauh lebih besar & menyolok daripada nav-tabs Bootstrap
biasa, karena ini adalah 3 menu paling penting setelah login.
"KELOLA" hanya dirender di HTML sama sekali kalau role pengguna
adalah KETUA atau ADMIN (lihat applyRoleVisibility() di JS).
===================================================================== */
.main-nav-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 10px;
margin-bottom: 18px;
}
.main-nav-grid.has-kelola {
grid-template-columns: repeat(4, 1fr);
}
.main-nav-btn {
border: 3px solid #e65100;
background: #fff;
color: #e65100;
border-radius: 14px;
padding: 14px 6px;
font-weight: 800;
font-size: 1rem;
text-transform: uppercase;
letter-spacing: 0.3px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 4px;
cursor: pointer;
box-shadow: 0 3px 0 rgba(230, 81, 0, 0.25);
transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease, color 0.12s ease;
}
.main-nav-btn .main-nav-icon {
font-size: 1.6rem;
line-height: 1;
}
.main-nav-btn:hover {
transform: translateY(-2px);
box-shadow: 0 5px 0 rgba(230, 81, 0, 0.3);
}
.main-nav-btn:active {
transform: translateY(1px);
box-shadow: 0 1px 0 rgba(230, 81, 0, 0.3);
}
.main-nav-btn.active {
background: linear-gradient(180deg, #ff9800, #e65100);
color: #fff;
border-color: #e65100;
box-shadow: 0 3px 0 rgba(166, 56, 0, 0.4);
}
/* Animasi "goyang" (wiggle) untuk menarik perhatian -- dipasang lewat
class .nav-wiggle yang ditambahkan via JS, lalu otomatis dilepas
setelah animasi selesai supaya tidak goyang TERUS-MENERUS dan
malah mengganggu (lihat playWiggle() di JS). */
@keyframes navWiggle {
0%   { transform: rotate(0deg); }
15%  { transform: rotate(-6deg); }
30%  { transform: rotate(5deg); }
45%  { transform: rotate(-4deg); }
60%  { transform: rotate(3deg); }
75%  { transform: rotate(-2deg); }
100% { transform: rotate(0deg); }
}
.nav-wiggle {
animation: navWiggle 0.6s ease-in-out;
}
/* =====================================================================
TAB KELOLA: kartu ringkas anggota & tombol aksi (edit/hapus/jadikan
ketua), dipakai di dalam #tabKelola.
===================================================================== */
.kelola-section-box {
border: 1px solid #ffe0b2;
border-radius: 10px;
padding: 14px;
margin-bottom: 16px;
background: #fffaf5;
}
.kelola-member-item {
border: 1px solid #ffe0b2;
border-radius: 8px;
padding: 10px 12px;
margin-bottom: 8px;
background: #fff;
}
.kelola-member-item .badge-ketua {
background-color: #e65100;
color: #fff;
font-size: 0.7rem;
text-transform: uppercase;
font-weight: bold;
border-radius: 5px;
padding: 2px 6px;
}
.kelola-tim-pill {
border: 2px solid #e65100;
color: #e65100;
background: #fff;
border-radius: 20px;
padding: 6px 16px;
font-weight: bold;
text-transform: uppercase;
font-size: 0.85rem;
cursor: pointer;
}
.kelola-tim-pill.active {
background: #e65100;
color: #fff;
}
.kelola-sheet-toolbar {
display: flex;
justify-content: space-between;
align-items: center;
gap: 10px;
flex-wrap: wrap;
margin-bottom: 10px;
}
.kelola-sheet-toolbar-actions {
display: flex;
align-items: center;
gap: 8px;
flex-wrap: wrap;
}
.kelola-sheet-meta {
font-size: 0.78rem;
font-weight: bold;
color: #8d6e63;
text-transform: uppercase;
letter-spacing: 0.04em;
}
.kelola-sheet-wrap {
border: 1px solid #ffe0b2;
border-radius: 12px;
overflow: auto;
background: #fff;
box-shadow: inset 0 0 0 1px #fff7f0;
}
.kelola-sheet-table {
width: 100%;
min-width: 1280px;
border-collapse: separate;
border-spacing: 0;
font-size: 0.83rem;
}
.kelola-sheet-table thead th {
position: sticky;
top: 0;
z-index: 2;
background: #fff3e0;
color: #bf5b04;
text-transform: uppercase;
font-size: 0.72rem;
letter-spacing: 0.04em;
border-bottom: 1px solid #ffd8a8;
}
.kelola-sheet-table th,
.kelola-sheet-table td {
padding: 10px 12px;
border-right: 1px solid #ffecda;
border-bottom: 1px solid #ffecda;
vertical-align: top;
white-space: nowrap;
}
.kelola-sheet-table th:last-child,
.kelola-sheet-table td:last-child {
border-right: none;
}
.kelola-sheet-table tbody tr:nth-child(even) {
background: #fffaf5;
}
.kelola-sheet-table tbody tr:hover {
background: #fff3e0;
}
.kelola-sheet-col-nomor {
width: 56px;
min-width: 56px;
text-align: center;
font-weight: bold;
color: #8d6e63;
background: #fffaf5;
}
.kelola-sheet-col-aksi {
min-width: 165px;
}
.kelola-sheet-cell-strong {
font-weight: bold;
color: #4e342e;
}
.kelola-sheet-cell-muted {
color: #8d6e63;
}
.kelola-sheet-badge {
display: inline-flex;
align-items: center;
justify-content: center;
min-width: 72px;
padding: 4px 10px;
border-radius: 999px;
font-size: 0.72rem;
font-weight: bold;
text-transform: uppercase;
letter-spacing: 0.04em;
}
.kelola-sheet-badge.status-final {
background: #d1f7e0;
color: #0a7a3d;
}
.kelola-sheet-badge.status-draft {
background: #fff0d5;
color: #b54708;
}
.report-status-badge {
display: inline-flex;
align-items: center;
justify-content: center;
min-width: 82px;
padding: 5px 10px;
border-radius: 999px;
font-size: 0.76rem;
font-weight: bold;
text-transform: uppercase;
letter-spacing: 0.04em;
}
.report-status-badge.status-final {
background: #d1f7e0;
color: #0a7a3d;
}
.report-status-badge.status-draft {
background: #fff0d5;
color: #b54708;
}
.kelola-sheet-actions {
display: flex;
gap: 6px;
flex-wrap: wrap;
}
.kelola-sheet-input {
min-width: 170px;
border: 1px solid #ffd8a8;
border-radius: 6px;
padding: 6px 8px;
font-size: 0.82rem;
background: #fffdf9;
}
.kelola-sheet-input[type="date"] {
min-width: 150px;
}
.kelola-sheet-input.is-dirty {
border-color: #e65100;
background: #fff3e0;
box-shadow: 0 0 0 2px rgba(230, 81, 0, 0.08);
}
.kelola-sheet-row-dirty td {
background: #fffaf0 !important;
}
.kelola-sheet-empty {
padding: 16px;
text-align: center;
font-size: 0.82rem;
font-weight: bold;
color: #8d6e63;
border: 1px dashed #ffd8a8;
border-radius: 10px;
background: #fffaf5;
}
/* Notifikasi kecil yang muncul tepat di sebelah tombol yang diklik
(SET kuota, SET jabatan, dll) supaya pengguna langsung tahu data
sudah tersimpan/gagal TANPA harus melihat ke atas halaman. */
.inline-feedback {
display: inline-flex;
align-items: center;
margin-left: 8px;
padding: 3px 10px;
border-radius: 14px;
font-size: 0.72rem;
font-weight: bold;
white-space: nowrap;
opacity: 0;
transform: translateY(-3px);
transition: opacity 0.18s ease, transform 0.18s ease;
pointer-events: none;
}
.inline-feedback.show {
opacity: 1;
transform: translateY(0);
}
.inline-feedback-success {
background-color: #d1f7e0;
color: #0a7a3d;
}
.inline-feedback-danger {
background-color: #fde2e2;
color: #b42318;
}
.btn-tambah-tim {
border: 2px dashed #e65100;
color: #e65100;
background: #fff7f0;
border-radius: 20px;
font-weight: bold;
text-transform: uppercase;
font-size: 0.85rem;
}
.btn-tambah-tim:hover {
background: #e65100;
color: #fff;
}
.alert-info {
background-color: #fff3e0;
color: #e65100;
border-color: #ffe0b2;
}
.photo-preview {
max-width: 100%;
height: auto;
margin-top: 10px;
border: 2px solid #ffb74d;
padding: 5px;
border-radius: 5px;
}
h5.section-title {
color: #e65100;
font-weight: bold;
text-transform: uppercase;
border-bottom: 2px solid #ffe0b2;
padding-bottom: 5px;
margin-top: 15px;
}
/* Menu titik tiga (⋮) di setiap card laporan, untuk aksi yang
sengaja dipisah jauh dari tombol EDIT (saat ini: HAPUS). */
.report-menu-dropdown {
position: absolute;
top: 110%;
right: 0;
z-index: 20;
background: #fff;
border: 1px solid #ffe0b2;
border-radius: 6px;
box-shadow: 0 4px 14px rgba(0,0,0,0.15);
min-width: 170px;
overflow: hidden;
}
.report-menu-item {
display: block;
width: 100%;
text-align: left;
background: none;
border: none;
padding: 8px 12px;
font-size: 1rem;
font-weight: bold;
text-transform: uppercase;
cursor: pointer;
}
.report-menu-item:hover {
background-color: #fff3e0;
}
/* Daftar riwayat laporan: dibesarkan agar konsisten dengan
area lain, meski elemen Bootstrap aslinya pakai class "small". */
#reportListContainer .list-group-item {
font-size: 1rem;
}
#reportListContainer .badge {
font-size: 0.85rem;
}
/* Overlay modal konfirmasi (delete, peringatan final, dll). */
.confirm-modal-overlay {
display: none;
position: fixed;
top: 0; left: 0; right: 0; bottom: 0;
background: rgba(0,0,0,0.5);
z-index: 1050;
align-items: center;
justify-content: center;
}
.confirm-modal-overlay.show {
display: flex;
}
.confirm-modal-box {
background: #fff;
border-radius: 10px;
max-width: 380px;
width: 90%;
padding: 20px;
box-shadow: 0 8px 24px rgba(0,0,0,0.25);
}
.confirm-modal-box h6 {
font-weight: bold;
text-transform: uppercase;
margin-bottom: 10px;
}
.confirm-modal-box p {
font-size: 0.9rem;
margin-bottom: 18px;
}
/* Highlight merah untuk field yang masih kosong saat SIMPAN DRAFT
ditekan tapi ada isian wajib yang belum lengkap. */
.field-kosong-warning {
border: 2px solid #dc3545 !important;
background-color: #fff5f5 !important;
}
/* Tombol PRINT hanya untuk laporan FINAL, dan hanya ditampilkan
di layar lebar (PC/laptop). Disembunyikan di HP/tablet sempit. */
.btn-print {
display: none;
}
.btn-edit-draft {
border-color: #0d6efd;
color: #0d6efd;
}
.btn-edit-final {
border-color: #198754;
color: #198754;
background: #eefbf3;
}
.btn-edit-final:hover {
background: #198754;
color: #fff;
}
.btn-print-final {
border-color: #198754;
color: #198754;
background: #eefbf3;
}
.btn-print-final:hover {
background: #198754;
color: #fff;
}
.btn-kuota-saved {
background: #198754;
border-color: #198754;
color: #fff;
}
.btn-kuota-saved:hover {
background: #157347;
border-color: #157347;
color: #fff;
}
.btn-kuota-dirty {
background: #fd7e14;
border-color: #fd7e14;
color: #fff;
}
.btn-kuota-dirty:hover {
background: #dc6b0f;
border-color: #dc6b0f;
color: #fff;
}
@media (min-width: 992px) {
.btn-print {
display: inline-block;
}
}
.print-access-note {
display: none;
}
@media (min-width: 992px) {
.print-access-note {
display: block;
font-size: 0.83rem;
font-weight: bold;
color: #8d6e63;
background: #fff7f0;
border: 1px dashed #ffcc80;
border-radius: 8px;
padding: 8px 10px;
margin-bottom: 12px;
}
}
/* Area cetak:
Jangan pakai display:none di mode normal, karena sebagian browser
menunda load <img> di elemen display:none sehingga foto sering kosong
saat dialog print muncul. Solusi: simpan di luar layar (offscreen)
supaya tetap bisa load, tapi tidak terlihat pengguna. */
.print-only {
position: absolute;
left: -10000px;
top: 0;
width: 1px;
height: 1px;
overflow: hidden;
}
@media print {
@page {
size: A4 portrait;
margin: 10mm;
}
body * {
visibility: hidden;
}
.print-only, .print-only * {
visibility: visible;
}
.print-only {
position: absolute;
top: 0;
left: 0 !important;
width: 100% !important;
height: auto !important;
overflow: visible !important;
}
.print-page {
padding: 0;
font-family: 'Times New Roman', Times, serif;
color: #000;
font-size: 12px; /* UBAHAN: dari 12.5px menjadi 12px */
-webkit-print-color-adjust: exact;
print-color-adjust: exact;
}
.print-sheet {
border: 1.5px solid #000;
padding: 14px 16px;
}
.print-title {
text-align: center;
font-size: 22px;
font-weight: bold;
text-transform: uppercase;
letter-spacing: 0.6px;
margin-bottom: 12px;
}
.print-meta {
width: 100%;
border-collapse: collapse;
margin-bottom: 10px;
}
.print-meta td {
border: 1px solid #000;
padding: 6px 8px;
vertical-align: top;
}
.print-meta td.label {
width: 19%;
font-weight: bold;
background: #f1f1f1;
}
.print-meta td.value {
width: 31%;
}
.print-section-title {
text-align: center;
font-weight: bold;
border: 1px solid #000;
border-bottom: none;
padding: 6px 8px;
margin-top: 10px;
}
.print-kegiatan-table {
width: 100%;
border-collapse: collapse;
font-size: 12px; /* UBAHAN: dari 12.5px menjadi 12px */
}
.print-kegiatan-table th,
.print-kegiatan-table td {
border: 1px solid #000;
padding: 6px 8px;
vertical-align: top;
}
.print-kegiatan-table th {
font-weight: bold;
text-align: center;
background: #f1f1f1;
}
.print-kegiatan-table .col-no {
width: 9%;
text-align: center;
}
.print-kegiatan-table .col-hari {
width: 23%;
}
.print-kegiatan-table .col-uraian {
min-height: 120px;
}
.print-photo-title {
font-weight: bold;
margin: 14px 0 6px;
}
.print-photo-box {
border: 1px solid #000;
height: 300px;
display: flex;
align-items: center;
justify-content: center;
overflow: hidden;
padding: 6px;
}
.print-photo-box img {
max-width: 100%;
max-height: 100%;
height: 100%;
width: auto;
object-fit: contain;
display: block;
}
.print-photo-empty {
color: #666;
font-style: italic;
}
.print-detail-row {
margin-top: 6px;
font-size: 11.5px;
}
.print-signature {
margin-top: 18px;
display: flex;
justify-content: space-between;
gap: 24px;
}
.print-signature .sign-block {
text-align: center;
width: 48%;
}
.print-signature .sign-line {
margin-top: 62px;
border-top: 1px solid #000;
padding-top: 4px;
font-weight: bold;
}
}
</style>
</head>
<body>
<div class="container">
<div id="loginPanel" class="card">
<div class="card-header"> LOGIN PELAPORAN</div>
<div class="card-body">
<div id="loginAlert"></div>
<form id="loginForm" onsubmit="handleLogin(event)">
<div class="mb-3">
<label for="loginNip" class="form-label">NIP (NOMOR INDUK PEGAWAI)</label>
<input type="text" id="loginNip" class="form-control" required>
</div>
<div class="mb-3" id="taskforceGroup" style="display: none;">
<label for="loginTaskforce" class="form-label">PILIH TASKFORCE</label>
<select id="loginTaskforce" class="form-select">
<option value="">-- PILIH TASKFORCE --</option>
</select>
</div>
<div class="mb-3" id="emailGroup" style="display: none;">
<label for="loginEmail" class="form-label">EMAIL AKTIF (REGISTRASI AWAL)</label>
<input type="email" id="loginEmail" class="form-control">
</div>
<button type="submit" id="loginBtn" class="btn btn-primary w-100">MASUK</button>
</form>
</div>
</div>
<div id="reportPanel" class="card" style="display: none;">
<div class="card-header d-flex justify-content-between align-items-center">
<span>📝 MENU UTAMA PELAPORAN</span>
<button class="btn btn-danger btn-sm fw-bold" onclick="handleLogout()">KELUAR</button>
</div>
<div class="card-body">
<div class="alert alert-info py-2 small">
👤 NIP: <span id="userNipDisplay" class="fw-bold"></span> | 💼 TASKFORCE: <span id="userTaskforceDisplay" class="fw-bold"></span>
</div>
<div class="main-nav-grid" id="mainNavGrid">
<button id="tabFormBtn" type="button" class="main-nav-btn active" onclick="switchTab('tabForm', event)">
<span class="main-nav-icon">📝</span>
<span>LAPORAN</span>
</button>
<button id="tabListBtn" type="button" class="main-nav-btn" onclick="switchTab('tabList', event)">
<span class="main-nav-icon">📂</span>
<span>RIWAYAT</span>
</button>
<button id="tabKelolaBtn" type="button" class="main-nav-btn" style="display:none;" onclick="switchTab('tabKelola', event)">
<span class="main-nav-icon">️</span>
<span>KELOLA</span>
</button>
<button id="tabPrintBtn" type="button" class="main-nav-btn" onclick="switchTab('tabPrint', event)">
<span class="main-nav-icon">🖨️</span>
<span>PRINT</span>
</button>
</div>

<!-- Kode JavaScript dan bagian HTML lainnya tetap sama, hanya bagian printReport yang diubah -->

</div>
</div>
</div>
<!-- ================================================================
AREA CETAK (PRINT) - hanya untuk laporan berstatus FINAL.
Disembunyikan di layar normal (display:none), hanya tampil saat
proses cetak (lihat @media print di bagian <style> dan fungsi
printReport() di bagian JavaScript di bawah).
================================================================= -->
<div id="printArea" class="print-only"></div>

<!-- Sisa kode JavaScript tetap sama persis -->

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
// ... (semua kode JavaScript tetap sama, kecuali fungsi printReport)

function printReport(id) {
const r = reportListCache[id];
if (!r) {
alert('DATA LAPORAN TIDAK DITEMUKAN. SILAKAN MUAT ULANG RIWAYAT.');
return;
}
if (norm(r.STATUS) !== 'final') {
alert('HANYA LAPORAN DENGAN STATUS FINAL YANG DAPAT DICETAK.');
return;
}
const tglBerangkat = String(r['TANGGAL BERANGKAT'] || '').split('T')[0];
const tglPulang = String(r['TANGGAL PULANG'] || '').split('T')[0];
const rentangTglRaw = tglBerangkat === tglPulang ? tglBerangkat : `${tglBerangkat} s/d ${tglPulang}`;
const rentangTglCetak = tglBerangkat === tglPulang
? formatPrintDate(tglBerangkat)
: `${formatPrintDate(tglBerangkat)} s/d ${formatPrintDate(tglPulang)}`;
const hariTanggal = tglBerangkat === tglPulang
? formatPrintDayDate(tglBerangkat)
: `${formatPrintDayDate(tglBerangkat)} s/d ${formatPrintDayDate(tglPulang)}`;
const tglSurat = String(r['TANGGAL SURAT TUGAS'] || '').split('T')[0];
const tujuanLokasi = [r['NAMA SLS'], r.ID_SubSLS].filter(Boolean).map(v => String(v).trim()).join(' / ');
const namaPelaksana = [r.TASKFORCE, r.NIP ? `NIP ${r.NIP}` : ''].filter(Boolean).join(' - ');
const detailWilayah = [
r.TIM ? `TIM ${escapeHtml(r.TIM)}` : '',
r['NAMA PML'] ? `PML ${escapeHtml(r['NAMA PML'])}` : '',
r['NAMA PPL'] ? `PPL ${escapeHtml(r['NAMA PPL'])}` : ''
].filter(Boolean).join(' | ');
const uraian = escapeHtml(r['URAIAN KEGIATAN'] || '-').replace(/\n/g, '<br>');
const fotoUrl = String(r.FOTO || '').trim();
const fotoUrlAttr = fotoUrl.replace(/"/g, '&quot;');
const fotoHtml = fotoUrl

// Penting: tunggu gambar selesai dimuat dulu sebelum memanggil print,
// kalau tidak sering kejadian gambar kosong saat dialog print muncul.
const doPrint = () => setTimeout(() => window.print(), 60);
if (fotoUrl) {
const img = document.getElementById('printFotoImg');
if (!img) {
doPrint();
return;
}
let done = false;
const finish = () => {
if (done) return;
done = true;
doPrint();
};
const candidates = buildPhotoCandidates(fotoUrl);
let idx = 0;
const tryNext = () => {
idx += 1;
if (idx >= candidates.length) {
finish();
return;
}
img.src = candidates[idx];
};
// Mulai dari kandidat pertama yang "paling aman"
if (candidates.length > 0) img.src = candidates[0];
img.addEventListener('load', finish);
img.addEventListener('error', tryNext);
// decode() membantu beberapa browser memastikan gambar benar-benar siap dirender
try {
if (img.decode) {
img.decode().then(finish).catch(() => {});
}
} catch (e) {}
// Fallback: jangan menggantung kalau link lambat/ditolak
setTimeout(finish, 8000);
} else {
doPrint();
}
}
